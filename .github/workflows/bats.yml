name: bats

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
  pull_request:
    branches: [main]
  schedule:
    # Runs daily at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      use_latest:
        description: "Test against latest fast k8s CI build"
        required: false
        type: boolean
        default: false

env:
  GO_VERSION: "1.26"
  K8S_VERSION: "v1.37.0"
  KIND_VERSION: "v0.33.0"
  IMAGE_NAME: registry.k8s.io/networking/dranet
  KIND_CLUSTER_NAME: kind

permissions:
  contents: read

jobs:
  bats_tests:
    runs-on: ubuntu-26.04
    name: Bats e2e tests
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up environment (download dependencies)
        run: |
          TMP_DIR=$(mktemp -d)
          # kubectl
          curl -L "https://dl.k8s.io/${{ env.K8S_VERSION }}/bin/linux/amd64/kubectl" -o "${TMP_DIR}/kubectl"
          # kind
          curl -Lo "${TMP_DIR}/kind" "https://kind.sigs.k8s.io/dl/${{ env.KIND_VERSION }}/kind-linux-amd64"
          # Install
          sudo install -m 0755 "${TMP_DIR}/kubectl" /usr/local/bin/kubectl
          sudo install -m 0755 "${TMP_DIR}/kind" /usr/local/bin/kind
          # Clean
          sudo rm -rf "${TMP_DIR}"

      - name: Fetch bpftool
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Authenticated download: anonymous release fetches from shared
          # runner addresses are unreliable and have failed the bpf tests.
          # The release CDN can still return errors, so retry a few times.
          for attempt in 1 2 3; do
            if gh release download v7.5.0 -R libbpf/bpftool -p 'bpftool-v7.5.0-amd64.tar.gz' -O "$RUNNER_TEMP/bpftool.tgz" --clobber; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "bpftool download failed after 3 attempts" >&2
              exit 1
            fi
            sleep 5
          done
          tar -xzf "$RUNNER_TEMP/bpftool.tgz" -C tests
          chmod +x tests/bpftool

      - name: Setup Bats and bats libs
        id: setup-bats
        uses: bats-core/bats-action@3566550e0f594451ac0f58fcbfdeca93aa29a45e # 4.1.0
        with:
          support-path: ${{ github.workspace }}/tests/test_helper/bats-support
          assert-path: "${{ github.workspace }}/tests/test_helper/bats-assert"
      - name: Bats tests
        shell: bash
        env:
          BATS_LIB_PATH: ${{ steps.setup-bats.outputs.lib-path }}
          TERM: xterm
          USE_LATEST: ${{ github.event_name == 'schedule' || inputs.use_latest == true }}
        run: bats -o _artifacts --print-output-on-failure tests/

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kind-logs-${{ env.JOB_NAME }}-${{ github.run_id }}
          path: ./_artifacts
