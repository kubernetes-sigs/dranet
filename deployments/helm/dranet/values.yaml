nameOverride: ""
fullnameOverride: ""

image:
  repository: registry.k8s.io/networking/dranet
  # tag defaults to .Chart.AppVersion when empty, which is set to the release tag at package time
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

rbac:
  create: true

podAnnotations: {}
podLabels: {}

logVerbosity: 4
metricsPort: ~
metricsPath: /healthz

# DRANET daemon arguments. Omit a field to use the binary's built-in default.
args: {}
#  filter: '!("dra.net/type" in attributes) || attributes["dra.net/type"].StringValue  != "veth"'
#  dbPath: "/var/run/dranet/dranet.db"
#  inventoryMinPollInterval: "2s"
#  inventoryMaxPollInterval: "1m"
#  inventoryPollBurst: 5
#  moveIBInterfaces: true
#  deviceAttachTimeout: 30s
#  cloudProviderHint: ""
#  cloudProviderOptions:
#    oke:
#      rdma-child-ipv4-cidr: "10.192.0.0/14"
#  profileProvider: "cloud"
#  webhookURL: ""
#  featureGates: ""

# kubeletRootDir is the kubelet data directory (its --root-dir). The driver's
# registration socket lives under <kubeletRootDir>/plugins_registry (which the
# kubelet watches) and its dra.sock under <kubeletRootDir>/plugins. The same path
# is used for the hostPath and the mountPath so it is identical inside and outside
# the container, as the kubeletplugin library requires. Set this to match the
# kubelet --root-dir on clusters that relocate it; the default suits a standard kubelet.
kubeletRootDir: /var/lib/kubelet

# hookBinDir is the host directory where an init container installs dranet-hook,
# the OCI createRuntime hook the container runtime runs before starting the
# containers of a Pod whose network devices are still being attached. The
# directory must be writable and on a filesystem that allows executables (not
# mounted noexec).
hookBinDir: /opt/dranet/bin

# Extra volumes and volume mounts for the dranet container.
# The chart adds them after the built-in ones without changes.
# Do not reuse the built-in volume names.
extraVolumes: []
#  - name: host-config
#    hostPath:
#      path: /etc/host-config
#      type: DirectoryOrCreate
extraVolumeMounts: []
#  - name: host-config
#    mountPath: /etc/host-config
#    readOnly: true

nodeSelector: {}

affinity: {}

tolerations:
  - operator: Exists
    effect: NoSchedule

resources:
  requests:
    cpu: 100m
    memory: 50Mi
  limits: {}

serviceAccount:
  annotations: {}
