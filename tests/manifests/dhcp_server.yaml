# DHCP server on the node side of the dhcp-cli/dhcp-srv veth pair.
apiVersion: v1
kind: Pod
metadata:
  name: dhcp-server
  labels:
    app: dhcp-server
spec:
  hostNetwork: true
  nodeSelector:
    kubernetes.io/hostname: dranet-test-cluster-worker
  containers:
  - name: udhcpd
    image: docker.io/library/busybox:1.37
    command:
    - sh
    - -c
    - |
      printf 'start 192.0.2.10\nend 192.0.2.20\ninterface dhcp-srv\nlease_file /tmp/udhcpd.leases\noption subnet 255.255.255.0\noption router 192.0.2.1\n' > /tmp/udhcpd.conf
      touch /tmp/udhcpd.leases
      exec udhcpd -f -v /tmp/udhcpd.conf
    securityContext:
      capabilities:
        add: ["NET_ADMIN", "NET_RAW"]
