---
# Claims the six dummy interfaces the NRI timeout e2e creates on one node.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: slow-attach-template
spec:
  spec:
    devices:
      requests:
      - name: nics
        exactly:
          count: 6
          deviceClassName: dra.net
          selectors:
          - cel:
              expression: has(device.attributes["dra.net"].ifName) && device.attributes["dra.net"].ifName.startsWith("slow")
