apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: dhcp-interface
spec:
  devices:
    requests:
    - name: req-dhcp
      exactly:
        deviceClassName: dra.net
        selectors:
          - cel:
              expression: has(device.attributes["dra.net"].ifName) && device.attributes["dra.net"].ifName == "dhcp-cli"
    config:
    - opaque:
        driver: dra.net
        parameters:
          interface:
            name: "eth99"
            addressing: "DHCP"
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-dhcp
  labels:
    app: pod-dhcp
spec:
  containers:
  - name: ctr1
    image: registry.k8s.io/e2e-test-images/agnhost:2.54
  resourceClaims:
  - name: dhcp
    resourceClaimName: dhcp-interface
