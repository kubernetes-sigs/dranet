apiVersion: resource.k8s.io/v1
kind:  ResourceClaim
metadata:
  name: dummy-interface-ipvlan
spec:
  devices:
    requests:
    - name: req-dummy-ipvlan
      exactly:
        deviceClassName: dra.net
        selectors:
          - cel:
              expression: has(device.attributes["dra.net"].ifName) && device.attributes["dra.net"].ifName == "dummy0"
    config:
    - opaque:
        driver: dra.net
        parameters:
          interface:
            type: "IPVLAN"
            addresses:
            - "169.254.200.10/24"
            mtu: 1400
            gsoMaxSize: 32768
            groMaxSize: 32768
            gsoIPv4MaxSize: 32768
            groIPv4MaxSize: 32768
            arpIgnore: 1
            arpAnnounce: 2
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-ipvlan
  labels:
    app: pod-ipvlan
spec:
  containers:
  - name: ctr1
    image: registry.k8s.io/e2e-test-images/agnhost:2.54
    # Keep the container running
    command: ["sleep", "infinity"]
  resourceClaims:
  - name: dummy1
    resourceClaimName: dummy-interface-ipvlan
