---
# Multi-container variant of pod_slow_attach.yaml: an init container, a
# sidecar, and an application container that exits so the kubelet restarts it.
apiVersion: v1
kind: Pod
metadata:
  name: pod-slow-attach
  labels:
    app: slow-attach
spec:
  resourceClaims:
  - name: nics
    resourceClaimTemplateName: slow-attach-template
  initContainers:
  - name: init
    image: registry.k8s.io/e2e-test-images/agnhost:2.54
    # Records which devices the first container of the pod saw.
    command: ["sh", "-c", "ip -br link show type dummy | wc -l > /shared/init-devices"]
    volumeMounts:
    - name: shared
      mountPath: /shared
  - name: sidecar
    image: registry.k8s.io/e2e-test-images/agnhost:2.54
    restartPolicy: Always
    args: ["pause"]
  containers:
  - name: app
    image: registry.k8s.io/e2e-test-images/agnhost:2.54
    # Exits once so the kubelet restarts it; the restart must not be gated.
    command: ["sh", "-c", "if [ ! -f /shared/restarted ]; then touch /shared/restarted; exit 0; fi; exec /agnhost pause"]
    volumeMounts:
    - name: shared
      mountPath: /shared
  volumes:
  - name: shared
    emptyDir: {}
