---
# Claims the six dummy interfaces the NRI timeout e2e creates on one node;
# the template is in slow_attach_template.yaml.
apiVersion: v1
kind: Pod
metadata:
  name: pod-slow-attach
  labels:
    app: slow-attach
spec:
  resourceClaims:
  - name: nics
    resourceClaimTemplateName: slow-attach-template
  containers:
  - name: agnhost
    image: registry.k8s.io/e2e-test-images/agnhost:2.54
    args: ["pause"]
