# A job of two Pods that are scheduled together (gang), with no topology
# constraint. Each Pod gets one interface on each rail.
apiVersion: scheduling.k8s.io/v1beta1
kind: PodGroup
metadata:
  name: job-plain
spec:
  schedulingPolicy:
    gang:
      minCount: 2
---
apiVersion: v1
kind: Pod
metadata:
  name: job-plain-0
  labels:
    app: job-plain
spec:
  terminationGracePeriodSeconds: 1
  schedulingGroup:
    podGroupName: job-plain
  resourceClaims:
  - name: rails
    resourceClaimTemplateName: one-interface-on-each-rail
  containers:
  - name: agnhost
    image: registry.k8s.io/e2e-test-images/agnhost:2.54
    command: ["sleep", "infinity"]
---
apiVersion: v1
kind: Pod
metadata:
  name: job-plain-1
  labels:
    app: job-plain
spec:
  terminationGracePeriodSeconds: 1
  schedulingGroup:
    podGroupName: job-plain
  resourceClaims:
  - name: rails
    resourceClaimTemplateName: one-interface-on-each-rail
  containers:
  - name: agnhost
    image: registry.k8s.io/e2e-test-images/agnhost:2.54
    command: ["sleep", "infinity"]
