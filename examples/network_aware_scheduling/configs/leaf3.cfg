# leaf3: rail 1, the L2 segment 198.18.3.0/24.

set / interface ethernet-1/1 description "to spine"
set / interface ethernet-1/1 subinterface 0 admin-state enable
set / interface ethernet-1/1 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/1 subinterface 0 ipv4 address 198.18.255.5/31

set / interface ethernet-1/2 description "rail 1 node port"
set / interface ethernet-1/2 subinterface 0 type bridged
set / interface ethernet-1/2 subinterface 0 admin-state enable
set / interface ethernet-1/3 description "rail 1 node port"
set / interface ethernet-1/3 subinterface 0 type bridged
set / interface ethernet-1/3 subinterface 0 admin-state enable

set / interface irb0 admin-state enable
set / interface irb0 subinterface 0 admin-state enable
set / interface irb0 subinterface 0 ipv4 admin-state enable
set / interface irb0 subinterface 0 ipv4 address 198.18.3.1/24

set / network-instance rail type mac-vrf
set / network-instance rail admin-state enable
set / network-instance rail interface ethernet-1/2.0
set / network-instance rail interface ethernet-1/3.0
set / network-instance rail interface irb0.0

set / network-instance default type default
set / network-instance default admin-state enable
set / network-instance default interface ethernet-1/1.0
set / network-instance default interface irb0.0
set / network-instance default next-hop-groups group spine admin-state enable
set / network-instance default next-hop-groups group spine nexthop 1 ip-address 198.18.255.4
set / network-instance default static-routes admin-state enable
set / network-instance default static-routes route 198.18.0.0/16 admin-state enable
set / network-instance default static-routes route 198.18.0.0/16 next-hop-group spine
