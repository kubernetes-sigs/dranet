# The spine routes between the leaves.

set / network-instance default type default
set / network-instance default admin-state enable
set / network-instance default static-routes admin-state enable

set / interface ethernet-1/1 description "to leaf1"
set / interface ethernet-1/1 subinterface 0 admin-state enable
set / interface ethernet-1/1 subinterface 0 ipv4 admin-state enable
set / interface ethernet-1/1 subinterface 0 ipv4 address 198.18.255.0/31
set / network-instance default interface ethernet-1/1.0
set / network-instance default next-hop-groups group leaf1 admin-state enable
set / network-instance default next-hop-groups group leaf1 nexthop 1 ip-address 198.18.255.1
set / network-instance default static-routes route 198.18.1.0/24 admin-state enable
set / network-instance default static-routes route 198.18.1.0/24 next-hop-group leaf1

