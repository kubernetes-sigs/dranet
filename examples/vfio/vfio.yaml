apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: dranet-vfio
spec:
  selectors:
  - cel:
      expression: device.driver == "dra.net" && device.attributes["dra.net"].vfio == true
  config:
  - opaque:
      driver: dra.net
      parameters:
        vfio: {}
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: vfio-function
spec:
  spec:
    devices:
      requests:
      - name: nic
        exactly:
          deviceClassName: dranet-vfio
          # Optionally narrow the choice with the attributes the function has
          # on its kernel driver, for example only SR-IOV VFs:
          selectors:
          - cel:
              expression: device.attributes["dra.net"].isSriovVf == true
---
apiVersion: v1
kind: Pod
metadata:
  name: vfio-pod
spec:
  containers:
  - name: ctr
    image: registry.k8s.io/e2e-test-images/agnhost:2.54
    command: ["sh", "-c", "ls -l /dev/vfio; sleep infinity"]
  resourceClaims:
  - name: nic
    resourceClaimTemplateName: vfio-function
